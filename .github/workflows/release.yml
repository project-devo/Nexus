name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Nexus.sln

      - name: Run Automated Tests
        run: dotnet test Nexus.sln -c Release --no-restore

      - name: Publish Self-Contained Executable
        run: |
          dotnet publish FileManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/Nexus-win-x64
          Compress-Archive -Path ./dist/Nexus-win-x64/Nexus.exe -DestinationPath ./dist/Nexus-Windows-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./dist/Nexus-Windows-x64.zip
          generate_release_notes: true
